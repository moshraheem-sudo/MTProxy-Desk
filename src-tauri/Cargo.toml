[package]
name = "mtproxy-desk"
version = "1.0.1"
description = "MTProxy Desk – Telegram Proxy Manager v1.0.1 by Mohammed Shaheed Al-Aajeebi"
authors = ["Mohammed Shaheed Al-Aajeebi"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "mtproxy_desk_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2.5"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
open = "5.3"
urlencoding = "2.1"
